<svg xmlns="http://www.w3.org/2000/svg" width="840" height="268" viewBox="0 0 840 268" font-family="'Courier New',Courier,monospace" font-weight="700">
<style>@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.bl{animation:bl 1s steps(1,end) infinite}
.fb{transform-box:fill-box;transform-origin:right}
@keyframes dr{0%{transform:scaleX(1)}15%{transform:scaleX(.77)}33%{transform:scaleX(.52)}50%{transform:scaleX(.28)}66%,100%{transform:scaleX(.03)}}
.dr{animation:dr 8s steps(1,end) infinite}
@keyframes tr{0%,15%{transform:scaleX(1)}21%,33%{transform:scaleX(.77)}39%,50%{transform:scaleX(.52)}56%,66%{transform:scaleX(.28)}72%,100%{transform:scaleX(.03)}}
.tr{animation:tr 8s infinite}
@keyframes fl{0%,14.9%,17%,32.9%,35%,49.9%,52%,65.9%,68%,100%{opacity:0}15%,33%,50%,66%{opacity:1}}
.fl{opacity:0;animation:fl 8s infinite}
@keyframes sh{0%,14.9%,16.5%,32.9%,34.5%,49.9%,51.5%,65.9%,67.5%,100%{transform:translate(0,0)}15%,33%,50%,66%{transform:translate(6px,0)}15.8%,33.8%,50.8%,66.8%{transform:translate(-6px,0)}}
.sh{animation:sh 8s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.75}}.pu{animation:pu 1.2s infinite}
@keyframes tm{0%,12.4%{opacity:1}12.5%,100%{opacity:0}}.tm{opacity:0;animation:tm 8s steps(1,end) infinite}
@keyframes r1{0%,11.9%{opacity:1}12%,100%{opacity:0}}.r1{animation:r1 8s steps(1,end) infinite}
@keyframes fi{0%,11.9%{opacity:0;transform:scale(1.9)}12%{opacity:1;transform:scale(1.9)}16%,71.9%{opacity:1;transform:scale(1)}72%,100%{opacity:0;transform:scale(1)}}
@keyframes ko{0%,71.9%{opacity:0;transform:scale(1.9)}72%{opacity:1;transform:scale(1.9)}76%,100%{opacity:1;transform:scale(1)}}
.pop{transform-box:fill-box;transform-origin:center;opacity:0}.fi{animation:fi 8s infinite}.ko{animation:ko 8s infinite}</style>
<defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.5" fill="#000" opacity=".22"/></pattern><radialGradient id="gl" cx=".12" cy=".05" r="1"><stop offset="0" stop-color="#2b2741"/><stop offset=".7" stop-color="#161826"/></radialGradient><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#796cbf"/><stop offset="1" stop-color="#b5abfc"/></linearGradient></defs>
